<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flask Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="chat-shell">
      <header>
        <p class="eyebrow">Flask demo</p>
        <h1>Chatbot</h1>
        <p>A small browser client backed by a Flask JSON endpoint.</p>
      </header>

      <section id="chat-box" class="chat-box" aria-live="polite" aria-label="Conversation"></section>

      <form id="chat-form">
        <label for="user-input" class="sr-only">Message</label>
        <input id="user-input" name="message" type="text" autocomplete="off" data-max-length="{{ max_message_length }}" placeholder="Type a message..." required />
        <button type="submit">Send</button>
      </form>
    </main>

    <script>
      const form = document.getElementById('chat-form');
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const maxMessageLength = Number(input.dataset.maxLength);

      function validateMessage() {
        // String iteration counts code points, matching Python's len().
        const tooLong = Array.from(input.value.trim()).length > maxMessageLength;
        input.setCustomValidity(tooLong
          ? `message must be ${maxMessageLength} characters or fewer`
          : '');
      }

      input.addEventListener('input', validateMessage);

      function appendMessage(role, text) {
        const message = document.createElement('div');
        message.className = `message ${role}`;
        message.textContent = text;
        chatBox.appendChild(message);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        validateMessage();
        if (!input.reportValidity()) return;
        const message = input.value.trim();
        if (!message) return;

        appendMessage('user', message);
        input.value = '';
        validateMessage();
        input.disabled = true;

        try {
          const response = await fetch('/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
          });
          const data = await response.json();
          appendMessage('bot', data.reply || data.error || 'Unexpected response');
        } catch (error) {
          appendMessage('bot', 'The server could not be reached.');
        } finally {
          input.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
